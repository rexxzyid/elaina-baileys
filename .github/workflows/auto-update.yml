name: Auto Update

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch / minor / major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: 'Force publish even if no WA changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --no-lockfile

      - name: Update WA version
        run: yarn update:version

      - name: Update WAProto
        id: proto
        run: yarn update:proto
        continue-on-error: true

      - name: Sync WAProto wrappers fallback
        if: steps.proto.outcome == 'failure'
        run: yarn sync:proto

      - name: Commit, bump, and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          CHANGED=$(git diff --staged --quiet && echo "no" || echo "yes")

          if [ "$CHANGED" = "no" ] && [ "$FORCE" != "true" ]; then
            echo "No changes detected, skipping release."
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs')

          const pkgPath = './package.json'
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))

          const current = pkg.version
          const bump = process.env.BUMP || 'patch'

          function bumpNormal(version, type) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/)

            if (!match) {
              throw new Error(`Unsupported normal version format: ${version}`)
            }

            let major = Number(match[1])
            let minor = Number(match[2])
            let patch = Number(match[3])

            if (type === 'major') {
              major++
              minor = 0
              patch = 0
            } else if (type === 'minor') {
              minor++
              patch = 0
            } else {
              patch++
            }

            return `${major}.${minor}.${patch}`
          }

          function bumpPrerelease(version) {
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)-([0-9A-Za-z-]+)\.(\d+)$/)

            if (!match) return null

            let major = Number(match[1])
            let minor = Number(match[2])
            let patch = Number(match[3])
            const tag = match[4]
            let sub = Number(match[5])

            if (sub >= 9) {
              patch++
              sub = 0
            } else {
              sub++
            }

            return `${major}.${minor}.${patch}-${tag}.${sub}`
          }

          const next = bumpPrerelease(current) || bumpNormal(current, bump)

          pkg.version = next
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')

          console.log(`Version bumped: ${current} -> ${next}`)
          NODE

          git add package.json

          VERSION=$(node -p 'require("./package.json").version')

          git commit -m "chore: release v${VERSION} — WA update $(date -u +%Y-%m-%d)"

          git pull --rebase origin main

          git tag "v${VERSION}"
          git push origin main --tags

          npm publish --access public

          echo "✓ Published @rexxhayanasi/elaina-baileys@${VERSION}"
