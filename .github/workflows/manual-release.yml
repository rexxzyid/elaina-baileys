name: Manual Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish even if no changes detected'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      

      - name: Install dependencies
        run: yarn install --no-lockfile

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          
          # Cek apakah versi ini sudah pernah di-publish sebelumnya
          if npm view "@rexxhayanasi/elaina-baileys@${VERSION}" version >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "Versi v${VERSION} sudah ada di npm. Melewati proses release."
              exit 0
            fi
            echo "Menjalankan force publish untuk versi v${VERSION}..."
          fi
          
          # Konfigurasi token npm secara manual hanya saat proses publish dilakukan
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          
          # Cek apakah versi mengandung tanda hubung (prerelease)
          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "Mendeteksi versi prerelease. Mempublikasikan dengan tag: --tag $TAG"
            npm publish --access public --tag "$TAG"
          else
            echo "Mendeteksi versi stable. Mempublikasikan dengan tag default (latest)."
            npm publish --access public
          fi
          
          echo "✓ Published @rexxhayanasi/elaina-baileys@${VERSION}"
