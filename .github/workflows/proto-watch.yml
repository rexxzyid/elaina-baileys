name: Proto Watch

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply new proto fields instead of only reporting them'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: elaina-baileys-proto-watch
  cancel-in-progress: false

env:
  PROTO_BUNDLE_DIR: bundle

jobs:
  watch:
    name: Watch WhatsApp Web proto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Identify as the repository owner
        run: |
          git config user.name "RexxHayanasi Pengen S.Kom"
          git config user.email "150516773+rexxzyid@users.noreply.github.com"

      - name: Download the WhatsApp Web bundle
        run: node ./script/fetchbundle.js bundle

      - name: Compare WhatsApp Web proto with WAProto
        id: proto
        continue-on-error: true
        run: node ./script/checkproto.js | tee proto-report.txt

      - name: Update the pinned client revision
        if: steps.proto.outputs.revision_outdated == 'true'
        run: npm run update:version

      - name: Apply new proto fields
        id: sync
        if: steps.proto.outputs.missing_count != '0' && steps.proto.outputs.missing_count != '' && github.event.inputs.apply != 'false'
        continue-on-error: true
        run: node ./script/syncproto.js | tee proto-sync.txt

      - name: Verify the patched proto still round-trips
        id: verify
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: node ./script/verifyproto.js

      - name: Roll back an unverified proto patch
        if: steps.sync.outcome == 'success' && steps.verify.outcome != 'success'
        run: git checkout -- WAProto

      - name: Commit and push
        id: commit
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SUBJECT="chore: sync WAProto with the WhatsApp Web bundle"

          if [ "${{ steps.proto.outputs.revision_outdated }}" = "true" ]; then
            SUBJECT="chore: WA update, client revision ${{ steps.proto.outputs.live_revision }}"
          fi

          git -c commit.gpgsign=false commit -m "${SUBJECT}"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin ${{ github.ref_name }} || true
          done

          echo "Push gagal setelah 4 percobaan."
          exit 1

      - name: Report fields that could not be applied
        if: always() && steps.proto.outputs.missing_count != '0' && steps.proto.outputs.missing_count != '' && (steps.sync.outcome == 'failure' || steps.verify.outcome == 'failure' || github.event.inputs.apply == 'false')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = name => fs.existsSync(name) ? fs.readFileSync(name, 'utf8').trim() : '(tidak ada keluaran)'
            const title = 'WAProto is behind the WhatsApp Web bundle'
            const body = [
              'The daily proto watch found fields WhatsApp Web declares that `WAProto` does not,',
              'and could not apply them automatically. Messages using them decode incompletely until this is fixed.',
              '',
              '```',
              read('proto-report.txt'),
              '```',
              '',
              '```',
              read('proto-sync.txt'),
              '```',
              '',
              'Reproduce locally with `npm run check:proto`, then `npm run sync:proto` to apply and',
              '`node ./script/verifyproto.js` to check the result round-trips.',
              '',
              'A gap in the `Message` oneof is never patched automatically — that one needs `WAProto` regenerated.'
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'proto-watch'
            })

            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              })
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['proto-watch']
            })
