name: Proto Watch

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      apply:
        description: 'Bump the pinned revision and apply proto changes instead of only reporting'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: elaina-baileys-proto-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch WhatsApp Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Identify as the repository owner
        run: |
          git config user.name "RexxHayanasi Pengen S.Kom"
          git config user.email "150516773+rexxzyid@users.noreply.github.com"

      # The previous snapshot is what makes the cross-revision diff possible.
      # Without it every run starts blind and can only report proto gaps.
      - name: Restore the previous bundle snapshot
        uses: actions/cache@v4
        with:
          path: .wa-bundle
          key: wa-bundle-${{ github.run_id }}
          restore-keys: |
            wa-bundle-

      - name: Check WhatsApp Web for updates
        id: wa
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.apply }}" = "false" ]; then
            npm run wa:update -- --keep 2
          else
            npm run wa:update -- --apply --keep 2
          fi

      - name: Read the verdict
        id: report
        run: |
          node -e '
            const fs = require("fs")
            const path = ".wa-bundle/report.json"
            if (!fs.existsSync(path)) {
              console.log("Laporan tidak ada, pipeline gagal sebelum menulis hasil.")
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "verdict=crashed\n")
              process.exit(0)
            }
            const r = JSON.parse(fs.readFileSync(path, "utf8"))
            const out = [
              `verdict=${r.verdict}`,
              `live=${r.live}`,
              `pinned=${r.pinned}`,
              `proto_gaps=${r.protoGaps}`,
              `verify_passed=${r.verifyPassed}`,
              `protocol_touched=${r.protocolTouched}`
            ].join("\n")
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out + "\n")
            console.log(out)
          '

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f .wa-bundle/report.md ]; then
            cat .wa-bundle/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Laporan tidak dihasilkan.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply missing proto fields
        id: sync
        if: steps.report.outputs.verdict == 'needs-work' && github.event.inputs.apply != 'false'
        continue-on-error: true
        run: npm run sync:proto | tee proto-sync.txt

      - name: Verify the patched proto still round-trips
        id: verify
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: npm run verify:proto

      - name: Roll back an unverified proto patch
        if: steps.sync.outcome == 'success' && steps.verify.outcome != 'success'
        run: git checkout -- WAProto

      - name: Commit and push
        id: commit
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          SUBJECT="chore: sync WAProto with the WhatsApp Web bundle"

          if [ "${{ steps.report.outputs.verdict }}" = "bump-only" ] || [ "${{ steps.report.outputs.verdict }}" = "bump-and-review" ]; then
            SUBJECT="chore: WA update, client revision ${{ steps.report.outputs.live }}"
          fi

          git -c commit.gpgsign=false commit -m "${SUBJECT}"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase origin ${{ github.ref_name }} || true
          done

          echo "Push gagal setelah 4 percobaan."
          exit 1

      - name: Report what could not be handled automatically
        if: always() && (steps.report.outputs.verdict == 'blocked' || steps.report.outputs.verdict == 'crashed' || (steps.report.outputs.verdict == 'needs-work' && steps.verify.outcome != 'success') || steps.report.outputs.protocol_touched == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = name => fs.existsSync(name) ? fs.readFileSync(name, 'utf8').trim() : '(tidak ada keluaran)'
            const verdict = '${{ steps.report.outputs.verdict }}'

            const alasan = {
              'blocked': 'Round-trip encoder gagal. Versi TIDAK dibump sampai ini hijau.',
              'crashed': 'Pipeline berhenti sebelum menulis laporan.',
              'needs-work': 'Ada field protobuf yang belum ada di WAProto dan sync otomatis tidak lolos verifikasi.',
              'bump-and-review': 'Revisi naik DAN ada permukaan protokol yang berubah. Perlu dibaca manual.'
            }[verdict] || `Verdict: ${verdict}`

            const body = [
              alasan,
              '',
              `- Revisi terpasang: \`${{ steps.report.outputs.pinned }}\``,
              `- Revisi live: \`${{ steps.report.outputs.live }}\``,
              `- Celah protobuf: ${{ steps.report.outputs.proto_gaps }}`,
              `- Round-trip: ${{ steps.report.outputs.verify_passed }}`,
              '',
              '<details><summary>Laporan lengkap</summary>',
              '',
              read('.wa-bundle/report.md'),
              '',
              '</details>',
              '',
              '<details><summary>Keluaran sync:proto</summary>',
              '',
              '```',
              read('proto-sync.txt'),
              '```',
              '',
              '</details>',
              '',
              'Reproduksi lokal: `npm run wa:update`, lalu `npm run sync:proto` dan `npm run verify:proto` bila perlu.',
              '',
              'Celah pada oneof `Message` tidak pernah ditambal otomatis — itu butuh WAProto digenerate ulang.'
            ].join('\n')

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'proto-watch'
            })

            if (existing.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body
              })
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'WhatsApp Web update needs attention',
              body,
              labels: ['proto-watch']
            })
