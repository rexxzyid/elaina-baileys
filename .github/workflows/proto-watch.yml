name: Proto Watch

on:
  schedule:
    - cron: '0 6 * * *'

  workflow_dispatch:
    inputs:
      apply:
        description: 'Terapkan pembaruan versi dan perubahan proto'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: elaina-baileys-proto-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch WhatsApp Web
    runs-on: ubuntu-latest

    env:
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.apply == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts

      - name: Identify as the repository owner
        run: |
          git config user.name "RexxHayanasi Pengen S.Kom"
          git config user.email "150516773+rexxzyid@users.noreply.github.com"

      - name: Restore previous bundle snapshot
        uses: actions/cache@v4
        with:
          path: .wa-bundle
          key: wa-bundle-${{ github.run_id }}
          restore-keys: |
            wa-bundle-

      - name: Prepare bundle workspace
        run: |
          mkdir -p .wa-bundle
          rm -f .wa-bundle/report.json .wa-bundle/report.md

      - name: Check WhatsApp Web for updates
        id: wa
        continue-on-error: true
        run: |
          if [ "$APPLY_CHANGES" = "true" ]; then
            npm run wa:update -- --apply --keep 2
          else
            npm run wa:update -- --keep 2
          fi

      - name: Read the verdict
        id: report
        run: |
          node -e '
            const fs = require("fs")
            const path = ".wa-bundle/report.json"

            if (!fs.existsSync(path)) {
              console.log("Laporan tidak ada, pipeline gagal sebelum menulis hasil.")
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "verdict=crashed\n")
              process.exit(0)
            }

            const report = JSON.parse(fs.readFileSync(path, "utf8"))
            const output = [
              `verdict=${report.verdict}`,
              `live=${report.live}`,
              `pinned=${report.pinned}`,
              `proto_gaps=${report.protoGaps}`,
              `verify_passed=${report.verifyPassed}`,
              `protocol_touched=${report.protocolTouched}`
            ].join("\n")

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`)
            console.log(output)
          '

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f .wa-bundle/report.md ]; then
            cat .wa-bundle/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Laporan tidak dihasilkan." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update WhatsApp client version
        id: version
        if: env.APPLY_CHANGES == 'true'
        continue-on-error: true
        run: npm run update:version

      - name: Synchronize WAProto
        id: sync
        if: env.APPLY_CHANGES == 'true'
        continue-on-error: true
        run: npm run sync:proto | tee proto-sync.txt

      - name: Verify WAProto
        id: verify
        if: always()
        continue-on-error: true
        run: npm run verify:proto

      - name: Roll back unverified WAProto changes
        if: always() && env.APPLY_CHANGES == 'true' && (steps.sync.outcome != 'success' || steps.verify.outcome != 'success')
        run: git checkout -- WAProto

      - name: Commit and push changes
        id: commit
        if: always() && steps.report.outcome == 'success' && steps.report.outputs.verdict != 'crashed' && steps.verify.outcome == 'success' && (env.APPLY_CHANGES != 'true' || (steps.version.outcome == 'success' && steps.sync.outcome == 'success'))
        run: |
          git add -A

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          SUBJECT="chore: sync WAProto with the WhatsApp Web bundle"

          if [ "${{ steps.report.outputs.verdict }}" = "bump-only" ] || [ "${{ steps.report.outputs.verdict }}" = "bump-and-review" ]; then
            SUBJECT="chore: WA update, client revision ${{ steps.report.outputs.live }}"
          fi

          git -c commit.gpgsign=false commit -m "$SUBJECT"

          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi

            if ! git pull --rebase origin ${{ github.ref_name }}; then
              git rebase --abort || true
            fi

            sleep $((2 ** attempt))
          done

          echo "Push gagal setelah 4 percobaan."
          exit 1

      - name: Report automation failure
        if: always() && (steps.report.outputs.verdict == 'blocked' || steps.report.outputs.verdict == 'crashed' || steps.report.outputs.verdict == 'bump-and-review' || steps.report.outputs.protocol_touched == 'true' || steps.version.outcome == 'failure' || steps.sync.outcome == 'failure' || steps.verify.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const read = name => fs.existsSync(name)
              ? fs.readFileSync(name, "utf8").trim()
              : "(tidak ada keluaran)"

            const verdict = "${{ steps.report.outputs.verdict }}"
            const versionOutcome = "${{ steps.version.outcome }}"
            const syncOutcome = "${{ steps.sync.outcome }}"
            const verifyOutcome = "${{ steps.verify.outcome }}"

            let reason = `Verdict: ${verdict}`

            if (verdict === "blocked") {
              reason = "Round-trip encoder gagal. Versi tidak dibump sampai verifikasi berhasil."
            }

            if (verdict === "crashed") {
              reason = "Pipeline berhenti sebelum menghasilkan laporan."
            }

            if (verdict === "bump-and-review") {
              reason = "Revisi dan permukaan protokol berubah sehingga perlu pemeriksaan manual."
            }

            if (versionOutcome === "failure") {
              reason = "Pembaruan versi WhatsApp gagal."
            }

            if (syncOutcome === "failure") {
              reason = "Sinkronisasi WAProto gagal."
            }

            if (verifyOutcome === "failure") {
              reason = "WAProto gagal melewati verifikasi round-trip."
            }

            const body = [
              reason,
              "",
              `- Revisi terpasang: \`${{ steps.report.outputs.pinned }}\``,
              `- Revisi live: \`${{ steps.report.outputs.live }}\``,
              `- Celah protobuf: ${{ steps.report.outputs.proto_gaps }}`,
              `- Round-trip laporan: ${{ steps.report.outputs.verify_passed }}`,
              `- update:version: ${versionOutcome}`,
              `- sync:proto: ${syncOutcome}`,
              `- verify:proto: ${verifyOutcome}`,
              "",
              "<details><summary>Laporan lengkap</summary>",
              "",
              read(".wa-bundle/report.md"),
              "",
              "</details>",
              "",
              "<details><summary>Keluaran sync:proto</summary>",
              "",
              "```",
              read("proto-sync.txt"),
              "```",
              "",
              "</details>",
              "",
              "Reproduksi lokal: `npm run proto:update`.",
              "",
              "Celah pada oneof `Message` harus diperiksa dan digenerate ulang secara manual."
            ].join("\n")

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "proto-watch"
            })

            if (issues.data.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body
              })
              return
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "WhatsApp Web update needs attention",
              body,
              labels: ["proto-watch"]
            })
