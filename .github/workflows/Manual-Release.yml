name: Manual Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Continue release checks even if version already exists'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: elaina-baileys-manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate package
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')

          if [ "$PACKAGE_NAME" != "@rexxhayanasi/elaina-baileys" ]; then
            echo "Package name tidak sesuai."
            echo "Ditemukan: ${PACKAGE_NAME}"
            echo "Seharusnya: @rexxhayanasi/elaina-baileys"
            exit 1
          fi

          if [ -z "$VERSION" ]; then
            echo "Version package.json tidak ditemukan."
            exit 1
          fi

          echo "Package : ${PACKAGE_NAME}"
          echo "Version : ${VERSION}"

      - name: Check NPM version
        id: npm_check
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        shell: bash
        run: |
          PACKAGE_NAME="@rexxhayanasi/elaina-baileys"
          VERSION=$(node -p 'require("./package.json").version')

          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo "${PACKAGE_NAME}@${VERSION} sudah tersedia di NPM."

            if [ "$FORCE" != "true" ]; then
              echo "Publish dilewati."
              exit 0
            fi

            echo "Force aktif, tetapi NPM tidak mengizinkan publish ulang versi yang sama."
            echo "Naikkan version di package.json terlebih dahulu."
            exit 1
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "${PACKAGE_NAME}@${VERSION} belum tersedia di NPM."

      - name: Publish to NPM
        if: steps.npm_check.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          PACKAGE_NAME="@rexxhayanasi/elaina-baileys"
          VERSION=$(node -p 'require("./package.json").version')

          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"

          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)

            echo "Prerelease terdeteksi."
            echo "Publishing ${PACKAGE_NAME}@${VERSION} dengan tag: ${TAG}"

            npm publish \
              --access public \
              --tag "${TAG}"
          else
            echo "Stable release terdeteksi."
            echo "Publishing ${PACKAGE_NAME}@${VERSION} dengan tag: latest"

            npm publish \
              --access public
          fi

          echo "Published ${PACKAGE_NAME}@${VERSION}"

      - name: Release summary
        if: steps.npm_check.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')

          echo "### Elaina Baileys Manual Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`@rexxhayanasi/elaina-baileys\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node.js: \`22\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$VERSION" == *"-"* ]]; then
            TAG=$(echo "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            echo "- NPM tag: \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NPM tag: \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          fi
